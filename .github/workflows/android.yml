name: Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'stack' }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'stackshift123' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar projeto Capacitor
        run: |
          npm install
          mkdir www
          cp -r index.html game.js style.css assets www/
          npx cap add android
          npx cap sync android

      - name: Ícone do app
        run: |
          if [ -f icon.png ]; then
            sudo apt-get install -y imagemagick > /dev/null
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; z=${d##*:}
              for f in ic_launcher ic_launcher_round; do
                convert icon.png -resize ${z}x${z} android/app/src/main/res/mipmap-$n/$f.png
              done
            done
          else
            echo "::warning::icon.png não encontrado; usando o ícone padrão"
          fi

      - name: Orientação retrato
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Compilar release (APK + AAB)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
          else
            keytool -genkeypair -keystore ks.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Stack Shift"
            echo "::warning::Chave temporária. Para a Play Store, cadastre sua chave nos secrets."
          fi

      - name: Assinar
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir out
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KS_PASS" \
            --out out/StackShift.apk out/aligned.apk
          rm out/aligned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/StackShift.aab
          jarsigner -keystore ks.jks -storepass "$KS_PASS" -keypass "$KS_PASS" out/StackShift.aab "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: StackShift-android
          path: out/*
